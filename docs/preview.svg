<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ScratchPeek by Sarr</title>
  <desc id="desc">Illustrated preview with example windows: a scratchpad indicator showing empty, hidden, open here, and open on another monitor, alongside a window list.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171923"/><stop offset="1" stop-color="#242139"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#b8a7ff"/><stop offset="1" stop-color="#79e0cf"/></linearGradient>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, DejaVu Sans, sans-serif">
    <g transform="translate(54 54)" stroke="url(#accent)" stroke-width="3" fill="none">
      <rect x="4" y="4" width="40" height="30" rx="5" opacity=".45"/>
      <rect x="13" y="13" width="40" height="30" rx="5"/>
      <path d="M18 29 Q33 13 48 29 Q33 45 18 29Z" fill="#202132"/>
      <circle cx="33" cy="29" r="4" fill="#79e0cf" stroke="none"/>
    </g>
    <text x="127" y="87" fill="#f3f0ff" font-size="37" font-weight="700">ScratchPeek</text>
    <text x="1054" y="80" fill="#b8a7ff" font-size="18">by Sarr</text>
    <text x="58" y="142" fill="#c6c4d8" font-size="22">Your hidden windows. In plain sight.</text>
    <text x="58" y="215" fill="#9592ae" font-size="12" letter-spacing="2">KNOW THE STATE</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="17">
      <rect x="58" y="236" width="505" height="57" rx="8" fill="#2a293b"/>
      <circle cx="82" cy="264" r="5" stroke="#85819d" stroke-width="2" fill="none"/>
      <text x="103" y="270" fill="#aaa7bc">0 · empty</text>
      <rect x="58" y="306" width="505" height="57" rx="8" fill="#2a293b"/>
      <circle cx="82" cy="334" r="5" fill="#aaa7bc"/>
      <text x="103" y="340" fill="#d3cee8">3 · hidden</text>
      <rect x="58" y="376" width="505" height="57" rx="8" fill="#253d3b" stroke="#79e0cf" stroke-opacity=".35"/>
      <circle cx="82" cy="404" r="5" fill="#79e0cf"/>
      <text x="103" y="410" fill="#9be9dc">3 · active here</text>
      <rect x="58" y="446" width="505" height="57" rx="8" fill="#2a293b"/>
      <path d="M77 480 L87 470 M77 470 H87 V480" stroke="#b8a7ff" stroke-width="2" fill="none"/>
      <text x="103" y="480" fill="#d3cee8">3 · open on DP-2</text>
    </g>
    <rect x="619" y="201" width="523" height="400" rx="12" fill="#1b1d29" stroke="#8176b1" stroke-width="1.5"/>
    <text x="644" y="239" fill="#e8e3ff" font-size="18" font-weight="700">ScratchPeek</text>
    <text x="1050" y="239" fill="#9690ad" font-size="13">Windows: 3</text>
    <text x="644" y="270" fill="#b8b2ce" font-size="14">hidden · DP-1  /  DP-2</text>
    <rect x="640" y="286" width="480" height="58" rx="5" fill="#343145"/>
    <text x="655" y="309" fill="#d9d2f4" font-size="14" font-weight="600">Browser · tab #1</text>
    <text x="655" y="331" fill="#9f97b6" font-size="13">Project notes</text>
    <rect x="640" y="350" width="480" height="58" rx="5" fill="#242532"/>
    <text x="655" y="373" fill="#d9d2f4" font-size="14" font-weight="600">Mixer · tab #1</text>
    <text x="655" y="395" fill="#9f97b6" font-size="13">Audio controls</text>
    <rect x="640" y="414" width="480" height="58" rx="5" fill="#242532"/>
    <text x="655" y="437" fill="#d9d2f4" font-size="14" font-weight="600">Terminal</text>
    <text x="655" y="459" fill="#9f97b6" font-size="13">Background task</text>
    <rect x="640" y="493" width="480" height="40" rx="5" fill="#353345"/>
    <text x="880" y="518" text-anchor="middle" fill="#e0daf6" font-size="14">Show here</text>
    <text x="645" y="562" fill="#b8b2ce" font-size="13">Language  ·  Automatic — English</text>
    <text x="1118" y="583" text-anchor="end" fill="#9690ad" font-size="12">By Sarr</text>
    <text x="58" y="582" fill="#c3bdd8" font-size="16">Live counts. Every monitor. All your tabs.</text>
    <text x="58" y="627" fill="#827d97" font-size="13">OMARCHY QUATTRO  ·  30 LANGUAGES  ·  MIT LICENSE</text>
    <text x="1142" y="627" text-anchor="end" fill="#827d97" font-size="12">Illustrated preview · example data</text>
  </g>
</svg>
