name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/model.test.cjs
      - run: python3 tests/test_updates.py
      - run: python3 tests/test_package.py
      - name: Check manifest and entry point
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('manifest.json').read_text())
          assert m['schemaVersion'] == 1
          assert m['author'] == 'Sarr'
          assert m['kinds'] == ['bar-widget']
          for entry in m['entryPoints'].values():
              assert not Path(entry).is_absolute() and '..' not in Path(entry).parts
              assert Path(entry).is_file()
          PY
